# ====================================================================
# mpv Configuration for Legacy Mac (GeForce 320M + Core 2 Duo)
# OS: Alpine Linux / Window Manager: Sway (Wayland)
# ====================================================================

# 1. 基础输出与渲染器设置
vo=gpu
gpu-context=wayland
hwdec=no                      # 显式关闭硬件解码，走 CPU 软件解码，避免 Nouveau 报错

# 2. 针对老旧 GPU 的性能配置 (Profile Optimization)
profile=fast                  # 使用轻量级画质预设，极大降低 320M 显卡的着色器负担
# interpolation=no            # 当显式设置 profile=fast , mpv默认就全局禁用了补帧功能 
dither-depth=no               # 禁用抖动算法以节省 GPU 资源
scale=bilinear                # 使用简单的双线性插值，降低 GPU 采样开销
cscale=bilinear
dscale=bilinear

# 3. CPU 软解多线程优化 (针对 Core 2 Duo 2 核)
vd-lavc-threads=2             # 充分利用双核 CPU 进行 FFmpeg 并行软解

# 4. 音视频同步与缓存 (防止 MKV 丢帧/卡顿)
video-sync=audio              # 以音频为基准同步，防止老硬件上出现画音不同步
demuxer-max-bytes=50M         # 限制解复用器缓存大小，节省系统 RAM
demuxer-max-back-bytes=25M
# --- 音频与字幕配置 ---
# 音频输出（若使用 PipeWire 设为 pipewire，若仅有 ALSA 设为 alsa）如不配置则自动协商
# ao=alsa
# 自动加载双语字幕，优化字幕渲染
sub-auto=fuzzy
# 优先选择中文字幕
slang=zh,chi,chs,sc

# 5. UI 与 OSD 界面轻量化
osd-font='sans-serif'
osd-font-size=24
osd-color='#FFFFFF'
osd-border-color='#000000'
osd-border-size=1

# 6. 其他常用优化
keep-open=yes                 # 播放结束后不自动关闭窗口
autofit-larger=100%x100%       # 限制窗口最大不超过屏幕分辨率
