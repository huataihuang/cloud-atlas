# --- 视频渲染与硬件加速 ---
# 开启 GPU 渲染模式
vo=gpu
# 指定 Wayland 原生上下文（适配 Sway）
gpu-context=wayland
# 强制使用 NVIDIA VDPAU 硬件解码（降低 Core 2 Duo CPU 负载）
hwdec=vdpau
# 硬件解码回退策略
hwdec-codecs=all

# --- 性能与采样调优 (针对弱 GPU 优化) ---
# 使用快速缩放算法，避免高负荷 bilinear/bilinear 过滤拖慢 320M 显卡
profile=fast
# 禁用过度的重采样与平滑处理
interpolation=no

# --- 音频与字幕配置 ---
# 音频输出（若使用 PipeWire 设为 pipewire，若仅有 ALSA 设为 alsa）
ao=alsa
# 自动加载双语字幕，优化字幕渲染
sub-auto=fuzzy
# 优先选择中文字幕
slang=zh,chi,chs,sc

# --- 界面与缓存 ---
# 保持播放器长宽比
keep-open=yes
# 针对本地文件增大预读缓存，防止磁盘 I/O 导致卡顿
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB
