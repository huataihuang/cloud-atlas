<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ========================================================== -->
  <!-- 1. 基础渲染优化（解决发虚、锯齿、清晰度问题）              -->
  <!-- ========================================================== -->
  
  <!-- 开启抗锯齿 -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- 开启 Hinting 微调 -->
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- 设置 Hinting 级别为 slight（适合 CJK 复杂矢量字形，防止变形） -->
  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <!-- 开启 LCD 亚像素渲染（针对标准 RGB 排列的液晶显示器） -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>

  <!-- 开启 LCD 滤镜，消除颜色边框 -->
  <match target="font">
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Disable Embedded Bitmaps（禁用嵌入位图，强制矢量渲染） -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>


  <!-- ========================================================== -->
  <!-- 2. 默认字体族映射与回退顺序 (Font Fallback)                -->
  <!-- ========================================================== -->

  <!-- 默认无衬线字体（用于 UI 界面、Waybar、应用标题栏） -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- 默认衬线字体 -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- 默认等宽字体（用于 Foot / Alacritty 等 Wayland 终端） -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

</fontconfig>
