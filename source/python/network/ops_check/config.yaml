# 全局 SSH 配置
ssh:
  user: ops
  key_file: ~/.ssh/id_ed25519   # 私钥路径
  port: 22
  timeout: 10

# 告警阈值
thresholds:
  disk_percent: 85
  mem_percent: 90
  load_per_core: 5.0

# 要检查的服务器列表
servers:
  - host: 10.0.1.11
    name: web-prod-01
  - host: 10.0.1.12
    name: web-prod-02
  - host: 10.0.2.21
    name: db-prod-01

# 远程要执行的采集命令（模板，{mount} 会被替换）
commands:
  disk: "df -P {mount} | tail -1"
  mem: "free | awk 'NR==2{print $3\" \"$2}'"
  load: "cat /proc/loadavg"
  service: "systemctl is-active {service}"
  cpu_cores: "nproc"

# 每台服务器要检查的服务
services:
  - nginx
  - postgresql
