  nvidia-exporter:
    image: docker.io/nvidia/dcgm-exporter:latest
    container_name: nvidia-exporter
    restart: always
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
