# This is the network config written by 'subiquity'
network:
  version: 2
  renderer: networkd
  ethernets:
    enp4s0:
      match:
        macaddress: 00:03:ee:00:29:89
      set-name: enp4s0
      dhcp4: no
      dhcp6: no
    enp5s0:
      accept-ra: true
    enp6s0:
      accept-ra: true
    enp7s0:
      accept-ra: true
  wifis:
    wlxfc221c500043:
      access-points:
        MY-SSID:
          password: MY-PASSWORD
      dhcp4: true
  bridges:
    br0:
      interfaces: [enp4s0]
      addresses:
        - 192.168.6.200/24
      routes:
        - to: default
          via: 192.168.6.1      # ← 改成你实际的网关
          metric: 200            # 比 br1 优先级低，作为备用
      parameters:
        stp: true
        forward-delay: 4
