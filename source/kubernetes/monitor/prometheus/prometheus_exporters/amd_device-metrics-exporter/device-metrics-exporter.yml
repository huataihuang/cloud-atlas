services:
...
  amdgpu-exporter:
    image: docker.io/rocm/device-metrics-exporter:v1.5.3
    container_name: amdgpu-exporter
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    privileged: true                  # 赋予特权，允许访问底层硬件性能计数器
    security_opt:
      - label=disable                 # 关闭 Podman SELinux 限制
    devices:
      - /dev/dri:/dev/dri             # 挂载全部 DRM 渲染与主节点
      - /dev/kfd:/dev/kfd             # 挂载异构队列接口（满足 RSMI 初始化需求）
    volumes:
      - /sys:/sys:ro                  # 只读挂载宿主机内核 sysfs 遥测目录
    networks:
      - ai-network
...
