global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  # ollama-mi50和amdgpu-exporter容器是独立的rootful容器，绑定了host主机回环地址端口
  # 通过 podman 内置的 host.containers.internal 访问物理主机(也可以手工指定物理主机实际IP)
  - job_name: 'gpu-metrics'
    static_configs:
      - targets: ['host.containers.internal:5000']
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama-exporter:8080']
