################################################################################
# mpv.conf - 适用于 OS X 10.9 Mavericks & GeForce 320M (Core 2 Duo)
################################################################################

# ==================== 1. 硬件解码与渲染优化 ====================
# 强制启用 OS X 原生 VideoToolbox 硬件解码 (针对 GeForce 320M 优化 H.264)
hwdec=videotoolbox

# 快速渲染预设：降低 GPU 滤镜开销，非常适合老显卡
profile=fast

# 视频输出后端：OS X 10.9 下推荐使用 opengl
vo=opengl

# 开启垂直同步，防止画面撕裂
vsync=display-resample


# ==================== 2. 外挂字幕优化 ====================
# 自动加载同目录下包含视频文件名相关的所有外挂字幕
sub-auto=fuzzy

# 优先选择中英文语言的字幕轨 (根据优先顺序排列)
slang=zh,chi,chs,sc,zh-CN,en,eng

# 解决旧系统下非 UTF-8 中文字幕 (如 GBK/GB2312) 乱码问题
sub-codepage=utf-8:gbk

# 字幕渲染字体与样式微调 (针对常规 SRT 纯文本字幕)
sub-font="Heiti SC"            # 选用 Mavericks 内置的系统黑体，清晰无乱码
sub-font-size=44                # 字幕字号大小
sub-border-size=2               # 黑色边框宽度，防止白底画面看不清文字
sub-color="#FFFFFF"             # 主文字颜色 (纯白)
sub-shadow-offset=1             # 极轻微阴影，增加文字立 context 边感

# 特效字幕 (ASS/SSA) 渲染设置：保持原作者设计样式
sub-ass-override=no


# ==================== 3. 播放与音频设置 ====================
# 退出时自动保存播放进度 (下一次打开相同视频会自动接着播)
save-position-on-quit=yes

# 缓存设置：避免老旧机械硬盘或低速网络读取导致卡顿
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=30MiB

# 启动时默认音量设置为 100% (最大可增益到 150%)
volume=100
volume-max=150


# ==================== 4. 界面与外观 ====================
# 保持播放器窗口比例与视频原比例一致
keep-open=yes                   # 播放完毕后不自动关闭窗口
autofit-larger=100%x100%        # 避免窗口尺寸超出 Mavericks 屏幕分辨率
